<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real Estate Photo Enhancer</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #6b7280;
      --accent: #0f62fe;
      --border: #d1d5db;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.4;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .controls {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      align-items: end;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    input[type="file"], select, button {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { filter: brightness(0.95); }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hint {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 8px;
    }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .card img {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #eef2f7;
    }

    .card .meta {
      padding: 10px 12px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .small {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .secondary {
      width: auto;
      padding: 8px 10px;
      background: #1f2a37;
    }

    .prompt {
      font-size: 0.9rem;
      background: #fbfdff;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 10px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Real Estate Photo Enhancer</h1>
    <p class="subtitle">Upload up to 5 photos, choose an interior style profile, and generate market-ready edited outputs locally in your browser.</p>

    <section class="panel">
      <div class="controls">
        <div>
          <label for="photoInput">Upload photos (max 5)</label>
          <input id="photoInput" type="file" accept="image/*" multiple />
          <div class="hint">Only local processing is used. No images are uploaded anywhere.</div>
        </div>

        <div>
          <label for="styleSelect">Interior style profile</label>
          <select id="styleSelect">
            <option value="neutral">Neutral Modern (recommended)</option>
            <option value="scandinavian">Scandinavian Bright</option>
            <option value="warm">Warm Contemporary</option>
            <option value="luxury">Luxury Crisp</option>
          </select>
        </div>

        <div>
          <button id="generateBtn" disabled>Generate edited photos</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <strong>Editing prompt used:</strong>
      <div class="prompt" id="promptText"></div>
    </section>

    <section>
      <h2>Output</h2>
      <div id="outputGrid" class="grid"></div>
    </section>
  </div>

  <script>
    const prompt = `Please enhance this property photo with the following instructions:
1. Brightness & Exposure
• Adjust brightness and exposure to make the space look naturally well-lit.
• Do not overexpose windows or create unnatural glare.
• Maintain realistic lighting consistent with how the unit actually looks.
2. Color Correction
• Correct white balance to neutral tones.
• Enhance colors slightly for a fresh and inviting feel.
• Keep wall colors, flooring, and furnishings true to real life (no artificial tint).
3. Sharpness & Alignment
• Straighten vertical and horizontal lines (walls, doors, windows).
• Improve clarity and sharpness moderately without over-processing.
4. Items & Furniture
• Do NOT remove, add, or alter any furniture or items.
• Do NOT declutter anything unless explicitly stated.
• Preserve the actual condition and layout of the property.
5. Overall Feel
• Aim for a bright, clean, market-ready presentation.
• Keep the result natural, professional, and suitable for property marketing.`;

    const styleProfiles = {
      neutral: { exposure: 1.08, saturation: 1.06, warmth: 0.0, contrast: 1.03, sharpness: 0.22 },
      scandinavian: { exposure: 1.12, saturation: 1.03, warmth: -0.02, contrast: 1.02, sharpness: 0.2 },
      warm: { exposure: 1.07, saturation: 1.08, warmth: 0.03, contrast: 1.04, sharpness: 0.23 },
      luxury: { exposure: 1.1, saturation: 1.1, warmth: 0.0, contrast: 1.08, sharpness: 0.26 }
    };

    const photoInput = document.getElementById('photoInput');
    const styleSelect = document.getElementById('styleSelect');
    const generateBtn = document.getElementById('generateBtn');
    const outputGrid = document.getElementById('outputGrid');
    const promptText = document.getElementById('promptText');
    promptText.textContent = prompt;

    let selectedFiles = [];

    photoInput.addEventListener('change', () => {
      const files = Array.from(photoInput.files || []);
      selectedFiles = files.slice(0, 5);

      if (files.length > 5) {
        alert('Only the first 5 photos will be processed.');
      }

      generateBtn.disabled = selectedFiles.length === 0;
      outputGrid.innerHTML = '';
    });

    generateBtn.addEventListener('click', async () => {
      if (!selectedFiles.length) return;
      generateBtn.disabled = true;
      generateBtn.textContent = 'Generating...';

      const profile = styleProfiles[styleSelect.value];
      outputGrid.innerHTML = '';

      for (const [index, file] of selectedFiles.entries()) {
        const image = await loadImage(file);
        const editedDataUrl = processImage(image, profile);
        appendResultCard(editedDataUrl, file.name, index + 1);
      }

      generateBtn.disabled = false;
      generateBtn.textContent = 'Generate edited photos';
    });

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    function processImage(img, profile) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;

      ctx.drawImage(img, 0, 0);
      let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

      applyGlobalAdjustments(imageData.data, profile);
      imageData = straightenAndSharpen(imageData, canvas.width, canvas.height, profile.sharpness);

      ctx.putImageData(imageData, 0, 0);
      return canvas.toDataURL('image/jpeg', 0.93);
    }

    function applyGlobalAdjustments(data, profile) {
      const highlightProtect = 0.92;
      for (let i = 0; i < data.length; i += 4) {
        let r = data[i] / 255;
        let g = data[i + 1] / 255;
        let b = data[i + 2] / 255;

        // Exposure with highlight protection
        const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        const lift = 1 + (profile.exposure - 1) * (1 - Math.pow(luminance, 1.6));
        r *= lift;
        g *= lift;
        b *= lift;

        // White balance / warmth shift
        r *= (1 + profile.warmth);
        b *= (1 - profile.warmth * 0.8);

        // Contrast around midpoint
        r = (r - 0.5) * profile.contrast + 0.5;
        g = (g - 0.5) * profile.contrast + 0.5;
        b = (b - 0.5) * profile.contrast + 0.5;

        // Modest saturation boost
        const gray = (r + g + b) / 3;
        r = gray + (r - gray) * profile.saturation;
        g = gray + (g - gray) * profile.saturation;
        b = gray + (b - gray) * profile.saturation;

        // Soft clipping to avoid blown highlights
        r = softClip(r, highlightProtect);
        g = softClip(g, highlightProtect);
        b = softClip(b, highlightProtect);

        data[i] = clamp01(r) * 255;
        data[i + 1] = clamp01(g) * 255;
        data[i + 2] = clamp01(b) * 255;
      }
    }

    function straightenAndSharpen(imageData, width, height, amount) {
      // Alignment note: automatic perspective correction is not performed in local-only mode.
      // Apply moderate unsharp mask style pass.
      const src = imageData.data;
      const out = new Uint8ClampedArray(src);
      const blurred = boxBlur(src, width, height);

      for (let i = 0; i < src.length; i += 4) {
        out[i] = clampByte(src[i] + amount * (src[i] - blurred[i]));
        out[i + 1] = clampByte(src[i + 1] + amount * (src[i + 1] - blurred[i + 1]));
        out[i + 2] = clampByte(src[i + 2] + amount * (src[i + 2] - blurred[i + 2]));
        out[i + 3] = src[i + 3];
      }
      return new ImageData(out, width, height);
    }

    function boxBlur(src, width, height) {
      const dst = new Uint8ClampedArray(src.length);
      const radius = 1;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          let rs = 0, gs = 0, bs = 0, as = 0, count = 0;
          for (let dy = -radius; dy <= radius; dy++) {
            for (let dx = -radius; dx <= radius; dx++) {
              const nx = x + dx;
              const ny = y + dy;
              if (nx < 0 || ny < 0 || nx >= width || ny >= height) continue;
              const idx = (ny * width + nx) * 4;
              rs += src[idx];
              gs += src[idx + 1];
              bs += src[idx + 2];
              as += src[idx + 3];
              count++;
            }
          }

          const outIdx = (y * width + x) * 4;
          dst[outIdx] = rs / count;
          dst[outIdx + 1] = gs / count;
          dst[outIdx + 2] = bs / count;
          dst[outIdx + 3] = as / count;
        }
      }

      return dst;
    }

    function appendResultCard(dataUrl, name, idx) {
      const card = document.createElement('article');
      card.className = 'card';

      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = `Edited output ${idx}`;

      const meta = document.createElement('div');
      meta.className = 'meta';

      const label = document.createElement('span');
      label.className = 'small';
      label.textContent = `Output ${idx}: ${name}`;

      const download = document.createElement('a');
      download.className = 'secondary';
      download.textContent = 'Download';
      download.href = dataUrl;
      download.download = `edited_${name.replace(/\.[^.]+$/, '')}.jpg`;

      meta.append(label, download);
      card.append(img, meta);
      outputGrid.appendChild(card);
    }

    function softClip(v, limit) {
      if (v <= limit) return v;
      return limit + (1 - Math.exp(-(v - limit) * 2.5)) * (1 - limit);
    }

    function clamp01(v) {
      return Math.min(1, Math.max(0, v));
    }

    function clampByte(v) {
      return Math.min(255, Math.max(0, v));
    }
  </script>
</body>
</html>
