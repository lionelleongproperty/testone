<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real Estate Photo Enhancer</title>
  <style>
    :root { --bg:#f5f7fb; --card:#fff; --text:#1f2a37; --muted:#6b7280; --accent:#0f62fe; --border:#d1d5db; --danger:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--text); background:var(--bg); }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { margin:0 0 8px; font-size:1.75rem; }
    .subtitle { margin:0 0 18px; color:var(--muted); }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
    .controls { display:grid; gap:12px; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); align-items:end; }
    label { display:block; margin-bottom:6px; font-weight:600; font-size:.95rem; }
    input, select, button, textarea { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:.95rem; background:#fff; }
    textarea { min-height: 140px; resize: vertical; }
    button { background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .hint { color:var(--muted); font-size:.88rem; margin-top:6px; }
    .status { margin-top:10px; font-size:.92rem; }
    .error { color: var(--danger); }
    .grid { display:grid; gap:16px; grid-template-columns: repeat(auto-fit,minmax(270px,1fr)); }
    .card { background:#fff; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    .card img { width:100%; height:220px; object-fit:cover; display:block; background:#eef2f7; }
    .meta { padding:10px 12px 12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .small { font-size:.85rem; color:var(--muted); }
    .secondary { width:auto; padding:8px 10px; background:#1f2a37; color:#fff; text-decoration:none; border-radius:8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Real Estate Photo Enhancer (ChatGPT Image Editing)</h1>
    <p class="subtitle">Upload up to 5 photos, choose interior style, then generate edited results through OpenAI image editing.</p>

    <section class="panel">
      <div class="controls">
        <div>
          <label for="photoInput">Upload photos (max 5)</label>
          <input id="photoInput" type="file" accept="image/*" multiple />
        </div>
        <div>
          <label for="styleSelect">Interior style profile</label>
          <select id="styleSelect">
            <option value="neutral">Neutral Modern (recommended)</option>
            <option value="scandinavian">Scandinavian Bright</option>
            <option value="warm">Warm Contemporary</option>
            <option value="luxury">Luxury Crisp</option>
          </select>
        </div>
        <div>
          <label for="apiKey">OpenAI API key (local use)</label>
          <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
        </div>
      </div>
      <div class="hint">Your API key is only used in this browser session. This static page directly calls OpenAI's Images Edit API.</div>
    </section>

    <section class="panel">
      <label for="promptText">Photo editing prompt</label>
      <textarea id="promptText"></textarea>
      <div class="controls" style="margin-top:12px; grid-template-columns: 1fr;">
        <button id="generateBtn" disabled>Generate with ChatGPT image editing</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section>
      <h2>Output</h2>
      <div id="outputGrid" class="grid"></div>
    </section>
  </div>

  <script>
    const basePrompt = `Please enhance this property photo with the following instructions:\n1. Brightness & Exposure\n• Adjust brightness and exposure to make the space look naturally well-lit.\n• Do not overexpose windows or create unnatural glare.\n• Maintain realistic lighting consistent with how the unit actually looks.\n2. Color Correction\n• Correct white balance to neutral tones.\n• Enhance colors slightly for a fresh and inviting feel.\n• Keep wall colors, flooring, and furnishings true to real life (no artificial tint).\n3. Sharpness & Alignment\n• Straighten vertical and horizontal lines (walls, doors, windows).\n• Improve clarity and sharpness moderately without over-processing.\n4. Items & Furniture\n• Do NOT remove, add, or alter any furniture or items.\n• Do NOT declutter anything unless I explicitly state which item to remove.\n• Preserve the actual condition and layout of the property.\n5. Overall Feel\n• Aim for a bright, clean, market-ready presentation.\n• Keep the result natural, professional, and suitable for property marketing.`;

    const styleText = {
      neutral: 'Interior style target: Neutral Modern. Keep tones balanced and clean with a subtle modern listing look.',
      scandinavian: 'Interior style target: Scandinavian Bright. Keep a bright airy mood with light neutral tones, minimal warmth.',
      warm: 'Interior style target: Warm Contemporary. Keep natural warmth and cozy tones while preserving true colors.',
      luxury: 'Interior style target: Luxury Crisp. Keep premium crisp clarity and balanced contrast without overprocessing.'
    };

    const photoInput = document.getElementById('photoInput');
    const styleSelect = document.getElementById('styleSelect');
    const apiKeyInput = document.getElementById('apiKey');
    const promptText = document.getElementById('promptText');
    const generateBtn = document.getElementById('generateBtn');
    const outputGrid = document.getElementById('outputGrid');
    const statusEl = document.getElementById('status');

    promptText.value = basePrompt;
    let selectedFiles = [];

    function refreshGenerateState() {
      generateBtn.disabled = !(selectedFiles.length > 0 && apiKeyInput.value.trim());
    }

    photoInput.addEventListener('change', () => {
      const files = Array.from(photoInput.files || []);
      selectedFiles = files.slice(0, 5);
      if (files.length > 5) alert('Only first 5 photos will be processed.');
      refreshGenerateState();
    });

    apiKeyInput.addEventListener('input', refreshGenerateState);

    generateBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey || !selectedFiles.length) return;

      outputGrid.innerHTML = '';
      statusEl.textContent = 'Generating images with OpenAI...';
      statusEl.className = 'status';
      generateBtn.disabled = true;

      try {
        for (const [idx, file] of selectedFiles.entries()) {
          statusEl.textContent = `Processing ${idx + 1}/${selectedFiles.length}: ${file.name}`;
          const fullPrompt = `${promptText.value.trim()}\n\n${styleText[styleSelect.value]}`;
          const dataUrl = await editImageWithOpenAI(file, fullPrompt, apiKey);
          appendResultCard(dataUrl, file.name, idx + 1);
        }
        statusEl.textContent = 'Done. Generated edited outputs from ChatGPT image editing.';
      } catch (err) {
        statusEl.textContent = `Generation failed: ${err.message}`;
        statusEl.className = 'status error';
      } finally {
        refreshGenerateState();
      }
    });

    async function editImageWithOpenAI(file, prompt, apiKey) {
      const form = new FormData();
      form.append('model', 'gpt-image-1');
      form.append('prompt', prompt);
      form.append('size', '1536x1024');
      form.append('image', file, file.name);

      const response = await fetch('https://api.openai.com/v1/images/edits', {
        method: 'POST',
        headers: { Authorization: `Bearer ${apiKey}` },
        body: form
      });

      const json = await response.json();
      if (!response.ok) {
        throw new Error(json?.error?.message || `HTTP ${response.status}`);
      }

      const b64 = json?.data?.[0]?.b64_json;
      if (!b64) throw new Error('No edited image returned by API.');
      return `data:image/png;base64,${b64}`;
    }

    function appendResultCard(dataUrl, name, idx) {
      const card = document.createElement('article');
      card.className = 'card';

      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = `Edited output ${idx}`;

      const meta = document.createElement('div');
      meta.className = 'meta';

      const label = document.createElement('span');
      label.className = 'small';
      label.textContent = `Output ${idx}: ${name}`;

      const download = document.createElement('a');
      download.className = 'secondary';
      download.textContent = 'Download';
      download.href = dataUrl;
      download.download = `edited_${name.replace(/\.[^.]+$/, '')}.png`;

      meta.append(label, download);
      card.append(img, meta);
      outputGrid.appendChild(card);
    }
  </script>
</body>
</html>
